<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Cute Album</title>
    <style>
      :root {
        --pink-1: #ffe8ef;
        --pink-2: #ffc5d3;
        --pink-3: #ff8aa5;
        --pink-4: #ff6b8a;
        --blue-1: #e8f8ff;
        --blue-2: #cfeeff;
        --text: #5d5a68;
        --card: rgba(255, 255, 255, 0.88);
        --shadow: rgba(255, 143, 167, 0.32);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        background: linear-gradient(135deg, var(--pink-1), var(--blue-1));
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .album {
        width: min(100%, 520px);
        background: var(--card);
        border: 3px dashed var(--pink-2);
        border-radius: 30px;
        box-shadow: 0 18px 40px var(--shadow);
        padding: 22px 22px 18px;
        position: relative;
        overflow: hidden;
      }

      .album::before,
      .album::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        background: rgba(255, 169, 190, 0.12);
        border-radius: 50%;
        z-index: 0;
      }

      .album::before {
        top: -70px;
        left: -40px;
      }

      .album::after {
        right: -60px;
        bottom: -80px;
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .music-box {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #fff3f7;
        border: 1px solid #ffd4df;
        border-radius: 18px;
        padding: 10px 14px;
        margin-bottom: 18px;
        box-shadow: inset 0 0 12px rgba(255, 143, 167, 0.08);
      }

      .music-box span {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--pink-4);
      }

      audio {
        width: min(100%, 220px);
        max-width: 100%;
        height: 34px;
      }

      .slider {
        position: relative;
        width: 100%;
        height: 430px;
        border-radius: 24px;
        overflow: hidden;
        background: linear-gradient(135deg, #fffdfd, #fff7fa);
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
        transform: scale(0.96);
        transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
      }

      .slide.active {
        opacity: 1;
        visibility: visible;
        transform: scale(1);
      }

      .cover {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: linear-gradient(135deg, #fff, #fff5f8);
        border: 2px solid #ffd5df;
        border-radius: 24px;
        box-shadow: inset 0 0 12px rgba(255, 143, 167, 0.08);
      }

      .cover h1 {
        font-size: clamp(2rem, 5vw, 2.5rem);
        color: var(--pink-4);
        margin-bottom: 10px;
        letter-spacing: 1px;
      }

      .cover p {
        font-size: 1.08rem;
        color: #6a6b71;
        margin-bottom: 18px;
      }

      .heart {
        font-size: 3.2rem;
        animation: beat 1.4s ease-in-out infinite;
      }

      @keyframes beat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.18); }
      }

      .photo-card {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .polaroid {
        width: min(90%, 350px);
        background: white;
        padding: 12px 12px 32px;
        border-radius: 14px;
        border: 1px solid #f0e6ea;
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08);
        transform: rotate(var(--tilt, 0deg));
      }

      .polaroid img {
        width: 100%;
        height: 320px;
        object-fit: cover;
        border-radius: 10px;
        display: block;
      }

      .caption {
        margin-top: 12px;
        text-align: center;
        font-size: 0.96rem;
        font-weight: 700;
        color: var(--pink-4);
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
        gap: 12px;
      }

      .btn {
        flex: 1;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--pink-3), var(--pink-4));
        color: white;
        font-size: 1rem;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(255, 107, 138, 0.35);
        transition: transform 0.2s ease, filter 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.04);
      }

      .dots {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      .dot {
        width: 12px;
        height: 12px;
        background: #f6d7e0;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .dot.active {
        background: var(--pink-4);
        width: 22px;
        border-radius: 999px;
      }

      .footer-note {
        text-align: center;
        margin-top: 16px;
        font-size: 0.82rem;
        color: #7d7282;
      }

      @media (max-width: 520px) {
        .album {
          padding: 18px 16px 16px;
        }

        .slider {
          height: 390px;
        }

        .polaroid img {
          height: 280px;
        }
      }
    </style>
  </head>
  <body>
    <div class="album">
      <div class="content">
        <div class="music-box">
          <span>🎵 Music</span>
          <audio controls autoplay loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
          </audio>
        </div>

        <div class="slider" aria-live="polite">
          <div class="slide cover active">
            <div>
              <h1>30 April 2024</h1>
              <p>Our first studio photos together 👀</p>
              <div class="heart">💞</div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: -3deg;">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80" alt="Photo 1" />
                <div class="caption">Memory #1 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: 2deg;">
                <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80" alt="Photo 2" />
                <div class="caption">Memory #2 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: -2deg;">
                <img src="https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=900&q=80" alt="Photo 3" />
                <div class="caption">Memory #3 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: 3deg;">
                <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80" alt="Photo 4" />
                <div class="caption">Memory #4 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: -4deg;">
                <img src="https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=900&q=80" alt="Photo 5" />
                <div class="caption">Memory #5 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: 4deg;">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=80" alt="Photo 6" />
                <div class="caption">Memory #6 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: -3deg;">
                <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=900&q=80" alt="Photo 7" />
                <div class="caption">Memory #7 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: 3deg;">
                <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80" alt="Photo 8" />
                <div class="caption">Memory #8 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: -2deg;">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=900&q=80" alt="Photo 9" />
                <div class="caption">Memory #9 🤍</div>
              </div>
            </div>
          </div>

          <div class="slide">
            <div class="photo-card">
              <div class="polaroid" style="--tilt: 2deg;">
                <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=900&q=80" alt="Photo 10" />
                <div class="caption">Memory #10 ❤️</div>
              </div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button class="btn" id="prevBtn" type="button">❮ Prev</button>
          <button class="btn" id="nextBtn" type="button">Next ❯</button>
        </div>

        <div class="dots" id="dots"></div>
        <div class="footer-note">Made with love, for you 💕</div>
      </div>
    </div>

    <script>
      const slides = document.querySelectorAll('.slide');
      const dotsContainer = document.getElementById('dots');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      let currentIndex = 0;

      slides.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'dot' + (index === 0 ? ' active' : '');
        dot.setAttribute('aria-label', 'Go to slide ' + (index + 1));
        dot.addEventListener('click', () => {
          currentIndex = index;
          updateSlides();
        });
        dotsContainer.appendChild(dot);
      });

      const dots = document.querySelectorAll('.dot');

      function updateSlides() {
        slides.forEach((slide, index) => {
          slide.classList.toggle('active', index === currentIndex);
        });

        dots.forEach((dot, index) => {
          dot.classList.toggle('active', index === currentIndex);
        });
      }

      prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        updateSlides();
      });

      nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % slides.length;
        updateSlides();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight') {
          currentIndex = (currentIndex + 1) % slides.length;
          updateSlides();
        }

        if (event.key === 'ArrowLeft') {
          currentIndex = (currentIndex - 1 + slides.length) % slides.length;
          updateSlides();
        }
      });

      setInterval(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        updateSlides();
      }, 5000);
    </script>
  </body>
</html>
